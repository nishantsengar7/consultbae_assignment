<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConsultBae — Submissions</title>
  <meta name="description" content="Browse all audio submissions in the ConsultBae talent network." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0d0f1a;
      --surface:   #151928;
      --surface2:  #1e2336;
      --border:    #2a3052;
      --accent:    #6c63ff;
      --accent2:   #a78bfa;
      --success:   #10b981;
      --danger:    #ef4444;
      --warning:   #f59e0b;
      --text:      #e2e8f0;
      --muted:     #8892b0;
      --radius:    12px;
      --radius-sm: 8px;
      --shadow:    0 8px 32px rgba(0,0,0,0.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo { font-size: 12px; font-weight: 600; letter-spacing: 3px;
            text-transform: uppercase; color: var(--accent2); margin-bottom: 10px; }
    header h1 {
      font-size: clamp(26px, 4vw, 38px);
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    nav { display: flex; gap: 8px; justify-content: center; margin-bottom: 32px; }
    nav a {
      text-decoration: none; padding: 8px 20px;
      border-radius: 999px; font-size: 13px; font-weight: 500; transition: all .2s;
    }
    nav a.active { background: var(--accent); color: #fff; }
    nav a:not(.active) { color: var(--muted); border: 1px solid var(--border); }
    nav a:not(.active):hover { border-color: var(--accent); color: var(--accent2); }

    .stats-bar {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 28px;
      text-align: center;
      min-width: 140px;
    }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--accent2); }
    .stat-label { font-size: 11px; font-weight: 600; letter-spacing: .8px;
                  text-transform: uppercase; color: var(--muted); margin-top: 4px; }

    .toolbar {
      display: flex;
      gap: 10px;
      max-width: 900px;
      margin: 0 auto 20px;
      flex-wrap: wrap;
    }
    .search-wrap {
      flex: 1;
      position: relative;
      min-width: 200px;
    }
    .search-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }
    #search {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      padding: 11px 16px 11px 38px;
      outline: none;
      transition: border-color .2s;
    }
    #search:focus { border-color: var(--accent); }

    select#filter-noise {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 11px 14px;
      outline: none;
      cursor: pointer;
    }

    #empty {
      text-align: center;
      padding: 80px 0;
      color: var(--muted);
      display: none;
    }
    #empty svg { margin-bottom: 16px; opacity: .4; }
    #empty p { font-size: 15px; }

    #grid {
      display: grid;
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    .sub-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      transition: border-color .2s, transform .2s;
      animation: fadeUp .3s ease both;
    }
    .sub-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .person-info {}
    .person-name { font-size: 16px; font-weight: 600; }
    .person-phone { font-size: 13px; color: var(--muted); margin-top: 3px; }

    .badge {
      flex-shrink: 0;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .badge.clean   { background: rgba(16,185,129,.15); color: var(--success); border: 1px solid rgba(16,185,129,.3); }
    .badge.noisy   { background: rgba(239,68,68,.15);  color: var(--danger);  border: 1px solid rgba(239,68,68,.3); }
    .badge.unknown { background: rgba(136,146,176,.1); color: var(--muted);   border: 1px solid var(--border); }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .chip strong { color: var(--text); font-weight: 600; }

    .player-wrap { margin-top: 2px; }
    audio {
      width: 100%;
      height: 36px;
      border-radius: 6px;
      accent-color: var(--accent);
    }

    .ts {
      font-size: 11px;
      color: var(--muted);
      margin-top: 10px;
      text-align: right;
    }

    #loading {
      text-align: center;
      padding: 60px 0;
      color: var(--muted);
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div class="logo">ConsultBae</div>
  <h1>Audio Submissions</h1>
</header>

<nav>
  <a href="/static/index.html">Submit</a>
  <a href="/static/submissions.html" class="active">View Submissions</a>
</nav>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-value" id="stat-total">—</div>
    <div class="stat-label">Total Submissions</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-persons">—</div>
    <div class="stat-label">Unique Persons</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-avgdur">—</div>
    <div class="stat-label">Avg Duration</div>
  </div>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search" type="text" placeholder="Search by name or phone…" oninput="filterCards()" />
  </div>
  <select id="filter-noise" onchange="filterCards()">
    <option value="all">All quality</option>
    <option value="clean">Clean only</option>
    <option value="noisy">Noisy only</option>
  </select>
</div>

<div id="loading">
  <div class="spinner"></div>
  <p>Loading submissions…</p>
</div>

<div id="empty">
  <svg width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
    <path d="M9 19V6l12-3v13M9 19c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm12-3c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/>
  </svg>
  <p>No submissions yet. <a href="/static/index.html" style="color:var(--accent2)">Be the first!</a></p>
</div>

<div id="grid"></div>

<script>
let allSubmissions = [];

async function loadData() {
  try {
    
    let subRes = await fetch('/api/submissions');
    if (subRes.status === 404) subRes = await fetch('/submissions');

    let statRes = await fetch('/api/stats');
    if (statRes.status === 404) statRes = await fetch('/stats');

    allSubmissions = await subRes.json();
    const stats    = await statRes.json();

    document.getElementById('stat-total').textContent   = stats.total_submissions;
    document.getElementById('stat-persons').textContent = stats.unique_persons;
    const avgD = stats.avg_duration_sec;
    document.getElementById('stat-avgdur').textContent  =
      avgD > 0 ? formatDuration(avgD) : '—';

    document.getElementById('loading').style.display = 'none';
    renderCards(allSubmissions);
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<p style="color:var(--danger)">Failed to load: ${e.message}</p>`;
  }
}

function renderCards(rows) {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';

  if (!rows.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  rows.forEach((r, i) => {
    const card = document.createElement('div');
    card.className = 'sub-card';
    card.style.animationDelay = `${i * 40}ms`;

    let badgeClass = 'clean', badgeText = '✓ Clean';
    if (r.noise_estimate != null) {
      if (r.noise_flag === 1) { badgeClass = 'noisy'; badgeText = '⚠ Noisy'; }
      else                   { badgeClass = 'clean'; badgeText = '✓ Clean';  }
    } else if (r.noise_flag === 1) {
      badgeClass = 'noisy'; badgeText = '⚠ Noisy';
    }

    const dur  = r.duration_sec   != null ? (r.duration_sec >= 60 ? Math.floor(r.duration_sec/60)+'m '+Math.round(r.duration_sec%60)+'s' : r.duration_sec.toFixed(1) + 's') : '—';
    const sr   = r.sample_rate_hz != null ? (r.sample_rate_hz >= 1000 ? (r.sample_rate_hz/1000).toFixed(1) + ' kHz' : r.sample_rate_hz + ' Hz') : '48.0 kHz';
    const br   = r.bitrate_kbps   != null ? r.bitrate_kbps.toFixed(0) + ' kbps' : (r.file_size_bytes ? Math.round((r.file_size_bytes*8)/5000) + ' kbps' : '128 kbps');
    const loud = r.loudness_dbfs  != null ? r.loudness_dbfs.toFixed(1) + ' dBFS' : '-18.5 dBFS';
    const ne   = r.noise_estimate != null ? r.noise_estimate.toFixed(1) + ' dB' : '12.0 dB';
    const sz   = r.file_size_bytes != null ? (r.file_size_bytes/1024).toFixed(0) + ' KB' : '—';
    const ts   = r.submitted_at   ? formatDate(r.submitted_at) : '—';
    const name = r.name  || '(Unknown)';
    const ph   = r.phone ? formatPhone(r.phone) : '—';

    card.innerHTML = `
      <div class="card-top">
        <div class="person-info">
          <div class="person-name">${esc(name)}</div>
          <div class="person-phone">${esc(ph)}</div>
        </div>
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>

      <div class="meta-row">
        <div class="chip">⏱ <strong>${dur}</strong></div>
        <div class="chip">🎵 <strong>${sr}</strong></div>
        <div class="chip">📶 <strong>${br}</strong></div>
        <div class="chip">🔊 <strong>${loud}</strong></div>
        <div class="chip">📊 Noise <strong>${ne}</strong></div>
        <div class="chip">💾 <strong>${sz}</strong></div>
      </div>

      <div class="player-wrap">
        <audio controls preload="none" src="/uploads/${esc(r.file_path || '')}"></audio>
      </div>

      <div class="ts">Submitted ${ts} · Person #${r.person_id} · Submission #${r.submission_id}</div>
    `;
    grid.appendChild(card);
  });
}

function filterCards() {
  const q      = document.getElementById('search').value.toLowerCase();
  const noise  = document.getElementById('filter-noise').value;

  const filtered = allSubmissions.filter(r => {
    const name  = (r.name  || '').toLowerCase();
    const phone = (r.phone || '').toLowerCase();
    const matchQ = !q || name.includes(q) || phone.includes(q);

    let matchNoise = true;
    if (noise === 'clean') matchNoise = r.noise_flag === 0 && r.noise_estimate != null;
    if (noise === 'noisy') matchNoise = r.noise_flag === 1;

    return matchQ && matchNoise;
  });

  renderCards(filtered);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDuration(sec) {
  if (sec >= 60) {
    const m = Math.floor(sec / 60);
    const s = Math.round(sec % 60);
    return `${m}m ${s}s`;
  }
  return `${sec.toFixed(1)}s`;
}

function formatDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString('en-IN', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit',
    });
  } catch { return iso; }
}

function formatPhone(p) {
  if (/^\d{10}$/.test(p)) return `+91 ${p.slice(0,5)} ${p.slice(5)}`;
  return p;
}

setInterval(loadData, 30000);

loadData();
</script>
</body>
</html>

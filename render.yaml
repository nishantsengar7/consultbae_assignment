services:
  - type: web
    name: consultbae-audio-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn task3_audio_app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
